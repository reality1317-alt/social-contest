<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f5f5"><title>社会コンクール攻略</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#222;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}main{max-width:740px;margin:auto;padding:28px 18px 60px}header{margin-bottom:24px}h1{font-size:clamp(27px,6vw,36px);margin:0 0 12px}header p{color:#777;margin:0;font-size:15px}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;color:#777;margin:18px 0}.pill{border-radius:99px;background:#ececec;padding:8px 12px;font-size:14px}.progress{height:9px;background:#ececec;border-radius:12px;overflow:hidden;margin:14px 0 24px}.progress div{background:#444;height:100%;transition:width .2s}.panel{background:#fff;border-radius:24px;padding:25px 20px;margin-bottom:16px;box-shadow:0 4px 20px #00000009}.question{font-size:clamp(23px,5.5vw,32px);line-height:1.6;min-height:155px;display:flex;align-items:center;margin:30px 0}.answer{font-size:clamp(25px,6vw,34px);font-weight:800;text-align:center;background:#f4f7f4;padding:24px 12px;border-radius:16px;margin:16px 0}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}button,select{font:inherit;border:0;border-radius:14px;padding:16px;cursor:pointer}button{font-weight:750}button:focus-visible,select:focus-visible{outline:3px solid #568bca;outline-offset:3px}.black{background:#222;color:white;width:100%;font-size:20px}.grade{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.grade button{font-size:clamp(15px,3.5vw,20px);min-height:85px;padding:10px 4px}.good{background:#dff5e7}.mid{background:#fff0c9}.bad{background:#ffe0e0}.secondary{background:#eaeaea}.hidden{display:none!important}select{background:#f0f0f0;width:100%;margin:7px 0 16px}.muted{color:#777;line-height:1.7;font-size:14px}.stat{font-size:28px;font-weight:800}.small{font-size:12px;color:#888;line-height:1.7}label{font-weight:700;font-size:15px}.question-label{display:inline-block;background:#ededed;border-radius:99px;padding:8px 12px;color:#444;font-size:14px}@media(max-width:400px){main{padding:20px 12px}.panel{padding:20px 16px}.grade button{min-height:78px}}
</style></head><body><main><header><h1>社会コンクール攻略</h1><p>小学4年生｜見た瞬間に答える練習</p></header>
<section id="setup" class="panel"><h2>練習をはじめよう</h2><label for="order">出題順</label><select id="order"><option value="alpha">αの順番</option><option value="beta">βの順番</option><option value="random">シャッフル</option><option value="wrong">苦手な問題だけ</option></select><label for="count">問題数</label><select id="count"><option value="10">今日の10問</option><option value="20">20問</option><option value="50">全50問</option></select><p class="muted">頭の中で答えたら「答えを見る」。答えを見てから、○・△・×で自己採点してね。</p><button id="start" class="black">練習スタート</button><p id="history" class="muted"></p></section>
<section id="quiz" class="hidden"><div class="topline"><span id="modeName">今日の10問</span><span id="counter">1 / 10</span></div><div class="progress"><div id="bar"></div></div><div class="panel"><span class="question-label">社会</span><div id="question" class="question"></div><button id="reveal" class="black">答えを見る</button><div id="answerArea" class="hidden"><div id="answer" class="answer"></div><div class="grade"><button class="good" data-grade="good">○ すぐ出た</button><button class="mid" data-grade="mid">△ 迷った</button><button class="bad" data-grade="bad">× わからない</button></div></div></div><button id="quit" class="secondary">途中で終了</button></section>
<section id="result" class="panel hidden"><h2>練習終了！</h2><div id="resultScore" class="stat"></div><p id="resultText" class="muted"></p><div class="row"><button id="again" class="black">もう一度練習</button><button id="retry" class="secondary">△・×を復習</button></div></section><p class="small">問題と解答はご提供の社会コンクールα・β練習問題と模範解答に基づいています。成績はこの端末のブラウザー内に保存されます。</p></main><script>
const DATA=[{"q": "北海道の世界遺産は？", "a": "知床"}, {"q": "青森県で生産量が全国1位の果物は？", "a": "りんご"}, {"q": "秋田県の東北三大祭りに選ばれている祭りは？", "a": "竿燈"}, {"q": "山形県で最上川の下流の平野は？", "a": "庄内平野"}, {"q": "岩手県の伝統工芸品は？", "a": "南部鉄器"}, {"q": "宮城県仙台市の別の呼び名は？", "a": "杜の都"}, {"q": "福島県で全国4位の大きさの湖は？", "a": "猪苗代湖"}, {"q": "日本の首都は？", "a": "東京"}, {"q": "神奈川県で160年ほど前に開かれた港は？", "a": "横浜港"}, {"q": "埼玉県の県庁所在地は？", "a": "さいたま市"}, {"q": "アクアラインの千葉県側の市は？", "a": "木更津市"}, {"q": "茨城県の利根川の下流の湿った土地をなんという？", "a": "水郷"}, {"q": "群馬県の嬬恋村でつくっている野菜は？", "a": "キャベツ"}, {"q": "栃木県の世界遺産は？（地名を漢字2字で）", "a": "日光"}, {"q": "愛知県でキャベツやメロンを作っている場所は？（半島で）", "a": "渥美半島"}, {"q": "セントレア空港の本当の名称は？", "a": "中部国際空港"}, {"q": "山梨県で果物を栽培している盆地は？", "a": "甲府盆地"}, {"q": "長野県で生産しているりんごは全国第何位？", "a": "2位"}, {"q": "静岡県で生産しているお茶は全国第何位？", "a": "1位"}, {"q": "岐阜県で輪中がみられるのはなんという平野？", "a": "濃尾平野"}, {"q": "新潟県の佐渡島で飼育している鳥は？", "a": "とき"}, {"q": "富山県で栽培している有名な花は？", "a": "チューリップ"}, {"q": "石川県の日本三名園は？", "a": "兼六園"}, {"q": "福井県の昔の国名は？", "a": "越前国"}, {"q": "石川県の伝統工芸品で陶磁器は？", "a": "九谷焼"}, {"q": "大阪府にある国際空港は？", "a": "関西国際空港"}, {"q": "京都府の伝統工芸品で織物は？", "a": "西陣織"}, {"q": "京都府の伝統工芸品で陶磁器は？", "a": "清水焼"}, {"q": "兵庫県で世界遺産は？", "a": "姫路城"}, {"q": "滋賀県にある日本一大きい湖は？", "a": "琵琶湖"}, {"q": "瀬戸内海で最大の島は？", "a": "淡路島"}, {"q": "三重県で真珠の養殖をしている半島は？", "a": "志摩半島"}, {"q": "奈良県の紀伊山地ではなんの木が有名？", "a": "すぎ"}, {"q": "和歌山県のうめの生産は全国第何位？", "a": "1位"}, {"q": "奈良県の吉野川は下流で名前が何にかわる？", "a": "紀ノ川"}, {"q": "広島県の世界遺産は？（神社で）", "a": "厳島神社"}, {"q": "岡山県の日本三名園は？", "a": "後楽園"}, {"q": "山口県の伝統工芸品は？", "a": "萩焼"}, {"q": "島根県の汽水湖は？", "a": "宍道湖"}, {"q": "島根県の世界遺産は？", "a": "石見銀山"}, {"q": "鳥取県の有名な漁港は？", "a": "境港"}, {"q": "香川県の平野は？", "a": "讃岐平野"}, {"q": "愛媛県で生産される全国第二位の果物は？", "a": "みかん"}, {"q": "徳島県の有名な踊りは？", "a": "阿波おどり"}, {"q": "高知県の有名な川は？（最後の清流）", "a": "四万十川"}, {"q": "高知県の伝統工芸品は？", "a": "土佐和紙"}, {"q": "福岡県の第二の都市は？", "a": "北九州市"}, {"q": "佐賀県の伝統工芸品は？", "a": "有田焼"}, {"q": "熊本県のカルデラで有名な山は？", "a": "阿蘇山"}, {"q": "大分県で有名な発電は？", "a": "地熱発電"}],BETA=[31, 38, 36, 32, 34, 25, 27, 35, 47, 39, 48, 30, 26, 46, 29, 28, 37, 40, 45, 49, 33, 18, 17, 43, 44, 5, 10, 11, 12, 14, 1, 3, 13, 0, 19, 6, 8, 2, 7, 4, 23, 20, 22, 21, 24, 16, 42, 41, 15, 9];
const $=id=>document.getElementById(id),KEY='social-contest-selfgrade-v1';let saved={good:0,mid:0,bad:0,review:[]};try{saved={...saved,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){}let deck=[],pos=0,stats={good:0,mid:0,bad:0},needs=[];
function store(){try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){}}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function show(id){['setup','quiz','result'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}
function history(){$('history').textContent=`これまで：○ ${saved.good}問 / △ ${saved.mid}問 / × ${saved.bad}問　｜　復習対象 ${saved.review.length}問`}
function start(override){let o=$('order').value,ids=override||(o==='alpha'?DATA.map((_,i)=>i):o==='beta'?BETA.slice():o==='random'?shuffle(DATA.map((_,i)=>i)):saved.review.slice());if(!ids.length){alert('復習する問題はありません。');return}deck=ids.slice(0,override?ids.length:Number($('count').value));pos=0;stats={good:0,mid:0,bad:0};needs=[];$('modeName').textContent=override?'今回の復習':o==='wrong'?'苦手問題の復習':deck.length===10?'今日の10問':`${deck.length}問練習`;show('quiz');render()}
function render(){if(pos>=deck.length){finish();return}let item=DATA[deck[pos]];$('counter').textContent=`${pos+1} / ${deck.length}`;$('bar').style.width=`${pos/deck.length*100}%`;$('question').textContent=item.q;$('answer').textContent=item.a;$('reveal').classList.remove('hidden');$('answerArea').classList.add('hidden')}
$('reveal').onclick=()=>{$('reveal').classList.add('hidden');$('answerArea').classList.remove('hidden')};
document.querySelectorAll('[data-grade]').forEach(btn=>btn.onclick=()=>{let grade=btn.dataset.grade,id=deck[pos];stats[grade]++;saved[grade]++;if(grade==='good'){saved.review=saved.review.filter(x=>x!==id)}else{if(!needs.includes(id))needs.push(id);if(!saved.review.includes(id))saved.review.push(id)}store();pos++;render()});
function finish(){show('result');$('resultScore').textContent=`○ ${stats.good}　△ ${stats.mid}　× ${stats.bad}`;$('resultText').textContent=`${deck.length}問中、すぐ答えられた問題 ${stats.good}問。復習対象 ${needs.length}問。`;$('retry').disabled=!needs.length;history()}
$('start').onclick=()=>start();$('quit').onclick=()=>{show('setup');history()};$('again').onclick=()=>{show('setup');history()};$('retry').onclick=()=>start(needs.slice());history();
</script></body></html>
